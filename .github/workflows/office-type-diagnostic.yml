name: Office typed diagnostic (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'PeterGuy326/orca' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'office-live-minimal'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - name: Capture frozen original diagnostics
        shell: bash
        run: |
          git show 654e1848b360606533fa9ea1456306ccd4067d49:examples/plugins/orca-trace-waterfall/dist/redesign.js > examples/plugins/orca-trace-waterfall/dist/redesign.js
          mkdir office-type-diagnostic
          node node_modules/oxlint/bin/oxlint --version
          node -p 'require("oxlint-tsgolint/package.json").version'
          node node_modules/oxlint/bin/oxlint --type-aware --config config/oxlint-code-quality-type-aware.json --format json examples/plugins/orca-trace-waterfall/dist/redesign.js > office-type-diagnostic/original.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: office-type-diagnostic
          path: office-type-diagnostic/original.json
          retention-days: 1
          if-no-files-found: error
