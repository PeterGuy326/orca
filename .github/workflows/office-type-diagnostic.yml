name: Office typed diagnostic (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'PeterGuy326/orca' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'office-live-minimal'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - name: Validate local statement exemptions and business canary
        shell: bash
        run: |
          node node_modules/oxlint/bin/oxlint --version
          node -p 'require("oxlint-tsgolint/package.json").version'
          node examples/plugins/orca-trace-waterfall/tests/bundle-type-lint.mjs "$GITHUB_WORKSPACE"
